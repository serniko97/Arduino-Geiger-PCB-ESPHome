esphome:
  name: arduino-geiger-pcb
  friendly_name: "Geiger Counter"

# Pull this component from GitHub. If you copied the components/ folder next to
# your config instead, use a local source (e.g. `source: .`).
external_components:
  - source: github://serniko97/Arduino-Geiger-PCB-ESPHome
    components: [arduino_geiger_pcb]

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: "yourEncryptionKey"

ota:
  password: "yourPassword"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  id: uart_bus
  rx_pin: GPIO16
  baud_rate: 9600

arduino_geiger_pcb:
  id: geiger_bus
  uart_id: uart_bus

sensor:
  - platform: arduino_geiger_pcb
    cpm:
      name: "Arduino Geiger PCB"
      unit_of_measurement: CPM
      state_class: measurement
      icon: mdi:radioactive
